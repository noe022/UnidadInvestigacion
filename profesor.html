<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>U.I.D. — Panel Profesor</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0D0D14;--s1:#121220;--s2:#181826;
  --mg:#A78BFA;--mg-dim:rgba(167,139,250,0.1);--mg-glow:rgba(167,139,250,0.3);
  --cy:#00E5FF;--cy-dim:rgba(0,229,255,0.1);--cy-glow:rgba(0,229,255,0.3);
  --gr:#39FF14;--gr-dim:rgba(57,255,20,0.1);
  --rd:#FF4444;--rd-dim:rgba(255,68,68,0.12);
  --am:#FFB800;--tx:#CCCAC0;--tx-b:#F0EDE4;--tx-d:#3A3850;
  --bd:rgba(167,139,250,0.2);
  --vt:'VT323',monospace;--mo:'Share Tech Mono','Courier New',monospace;
  --orb:'Orbitron',sans-serif;
}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--mo);font-size:14px}
body::after{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 1px,rgba(0,0,0,0.06) 1px,rgba(0,0,0,0.06) 2px)}

/* TOP BAR */
.top-bar{
  background:rgba(5,5,10,0.97);border-bottom:1px solid var(--bd);
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  box-shadow:0 1px 0 rgba(167,139,250,0.1),0 4px 20px rgba(0,0,0,0.9);
}
.bar-logo{font-family:var(--vt);font-size:28px;color:var(--mg);letter-spacing:3px;text-shadow:0 0 10px var(--mg-glow)}
.bar-title{font-family:var(--mo);font-size:11px;color:var(--cy);letter-spacing:3px}
.status-pill{
  font-family:var(--mo);font-size:11px;padding:5px 14px;border:1px solid;letter-spacing:2px;
  transition:all .3s;
}
.status-pill.open{color:var(--gr);border-color:var(--gr);box-shadow:0 0 8px rgba(57,255,20,0.3)}
.status-pill.closed{color:var(--rd);border-color:var(--rd);box-shadow:0 0 8px rgba(255,68,68,0.3)}

/* MAIN */
.main{padding:24px;max-width:800px;margin:0 auto}
.sec-hdr{
  font-size:10px;color:var(--cy);letter-spacing:5px;
  margin-bottom:16px;padding-bottom:8px;
  border-bottom:1px solid rgba(0,229,255,0.15);
}

/* COUNTER */
.counter-box{
  background:var(--s1);border:1px solid var(--bd);
  padding:24px;margin-bottom:24px;display:flex;align-items:center;gap:24px;
}
.counter-num{font-family:var(--vt);font-size:72px;color:var(--am);line-height:1;
  text-shadow:0 0 20px rgba(255,184,0,0.4)}
.counter-info{flex:1}
.counter-label{font-size:12px;color:var(--tx-d);letter-spacing:2px;margin-bottom:4px}
.counter-bar{height:8px;background:var(--s2);margin-top:12px;border:1px solid var(--bd)}
.counter-fill{height:100%;background:var(--am);transition:width .5s;box-shadow:0 0 8px rgba(255,184,0,0.4)}

/* BUTTONS */
.btn-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.btn{
  font-family:var(--mo);font-size:11px;letter-spacing:2px;
  padding:14px 20px;cursor:pointer;border:1px solid;background:transparent;
  transition:all .2s;min-height:48px;flex:1;min-width:140px;
}
.btn-cy{color:var(--cy);border-color:var(--cy)}
.btn-cy:hover{background:var(--cy-dim);box-shadow:0 0 14px var(--cy-glow)}
.btn-gr{color:var(--gr);border-color:var(--gr)}
.btn-gr:hover{background:var(--gr-dim);box-shadow:0 0 14px rgba(57,255,20,0.3)}
.btn-rd{color:var(--rd);border-color:var(--rd)}
.btn-rd:hover{background:var(--rd-dim);box-shadow:0 0 14px rgba(255,68,68,0.3)}
.btn:disabled{opacity:.3;cursor:not-allowed}

/* RESULTS */
.case-section{margin-bottom:32px}
.case-title{
  font-family:var(--vt);font-size:24px;color:var(--tx-b);
  margin-bottom:14px;letter-spacing:1px;
  padding-bottom:8px;border-bottom:1px solid var(--bd);
}
.qblock{background:var(--s1);border:1px solid var(--bd);padding:16px;margin-bottom:10px}
.qnum{font-size:9px;color:var(--mg);letter-spacing:3px;margin-bottom:6px}
.qtext{font-size:13px;color:var(--tx-b);margin-bottom:14px;line-height:1.5;font-weight:600}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bar-letter{font-size:11px;color:var(--mg);width:18px;flex-shrink:0}
.bar-wrap{flex:1;background:var(--s2);height:30px;position:relative;border:1px solid rgba(167,139,250,0.1)}
.bar-fill{height:100%;transition:width .6s ease;display:flex;align-items:center;padding-left:8px}
.bar-fill.correct{background:rgba(57,255,20,0.25);border-right:2px solid var(--gr)}
.bar-fill.wrong{background:rgba(167,139,250,0.15)}
.bar-pct{font-size:11px;color:var(--tx-b);white-space:nowrap}
.bar-count{font-size:11px;color:var(--tx-d);width:28px;text-align:right;flex-shrink:0}
.correct-label{font-size:9px;color:var(--gr);letter-spacing:2px;margin-top:4px;text-align:right}

.empty{
  border:1px solid var(--bd);padding:24px;text-align:center;
  font-size:13px;color:var(--tx-d);
}

/* Auto refresh */
.auto-info{font-size:11px;color:var(--tx-d);margin-top:8px;letter-spacing:1px}
</style>
</head>
<body>

<div class="top-bar">
  <span class="bar-logo">U.I.D.</span>
  <span class="bar-title">PANEL PROFESOR</span>
  <span class="status-pill open" id="status-pill">● ENVÍOS ABIERTOS</span>
</div>

<div class="main">

  <div class="sec-hdr">ESTADO DE LOS EQUIPOS</div>
  <div class="counter-box">
    <div class="counter-num" id="num-enviados">0</div>
    <div class="counter-info">
      <div class="counter-label">EQUIPOS QUE HAN ENVIADO</div>
      <div style="font-family:var(--mo);font-size:13px;color:var(--tx)">de 6 equipos en total</div>
      <div class="counter-bar"><div class="counter-fill" id="counter-fill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-cy" onclick="cargarResultados()">↻ ACTUALIZAR</button>
    <button class="btn btn-gr" onclick="toggleAutoRefresh()" id="btn-auto">▶ AUTO (10s)</button>
    <button class="btn btn-rd" onclick="cerrarEnvios()" id="btn-cerrar">⊘ CERRAR ENVÍOS</button>
    <button class="btn btn-rd" onclick="resetearRespuestas()" id="btn-reset">⌫ RESETEAR</button>
  </div>
  <div class="auto-info" id="auto-info"></div>

  <div style="margin-top:24px">
    <div class="sec-hdr">RESULTADOS GLOBALES</div>
    <div id="resultados"></div>
  </div>

</div>

<script>
const FIREBASE_URL = 'https://uid-proyecto-fcebb-default-rtdb.europe-west1.firebasedatabase.app';

const CASES = {
  1: {
    title: 'Expediente 01 — El caso Álvaro',
    preguntas: [
      { key:'1-0', text:'¿Cuál fue el primer error de Álvaro?', opts:['Usó Instagram en WiFi pública','Hizo clic en el enlace del SMS sin verificar el dominio','Usaba una contraseña débil','Compartió su usuario en redes sociales'], correct:1 },
      { key:'1-1', text:'¿Qué señal delata más claramente que el email es falso?', opts:['La hora de envío','Que el asunto menciona 24 horas','La dirección: security@instagram-account-verify.com','Que el email está en español'], correct:2 },
      { key:'1-2', text:'¿Qué debería haber hecho Álvaro al recibir la alerta?', opts:['Responder al email','Abrir la app oficial de Instagram directamente','Reenviar el email a sus contactos','Cambiar la contraseña por el enlace del email'], correct:1 }
    ]
  },
  2: {
    title: 'Expediente 02 — El caso Marta',
    preguntas: [
      { key:'2-0', text:'¿Cuál indicador delata que el audio es un deepfake?', opts:['La duración (47 segundos)','El formato OGG','Los micro-cortes y las irregularidades en frecuencias altas','Que llegó por WhatsApp'], correct:2 },
      { key:'2-1', text:'¿Cómo verificar si el audio era real antes de difundirlo?', opts:['Escucharlo varias veces','Contactar directamente con Marta por otro canal','Buscarlo en Google','Ver cuántas veces fue escuchado'], correct:1 },
      { key:'2-2', text:'¿Quién puede tener responsabilidad legal?', opts:['Solo quien creó el deepfake','Solo Marta, por tener videos públicos','Solo el creador y quien lo difundió primero','El creador y todos los que lo difundieron a sabiendas'], correct:3 }
    ]
  },
  3: {
    title: 'Expediente 03 — El caso Lucas',
    preguntas: [
      { key:'3-0', text:'¿Cómo obtuvo el atacante la información sin conocer a Lucas?', opts:['Hackeó los servidores de Instagram','Analizó visualmente sus fotos públicas: escudo, calle, menciones y horarios','Compró sus datos a una empresa','Accedió con una contraseña robada'], correct:1 },
      { key:'3-1', text:'¿Qué debe hacer Lucas ante el mensaje de extorsión?', opts:['Pagar los 200€','Ignorar el mensaje','Hablar con un adulto, guardar el mensaje y denunciar. NUNCA pagar.','Bloquear al remitente'], correct:2 },
      { key:'3-2', text:'¿Qué medida habría impedido este ataque desde el principio?', opts:['Una contraseña más segura','Perfil en privado y ser consciente de qué información revela cada foto','No tener Instagram','Publicar solo paisajes'], correct:1 }
    ]
  }
};

let autoInterval = null;
let enviosCerrados = false;

async function resetearRespuestas(){
  if(!confirm('¿Seguro? Esto borrará todas las respuestas recibidas.')) return;
  await fetch(`${FIREBASE_URL}/respuestas.json`, {
    method:'DELETE'
  });
  await cargarResultados();
}

async function cargarResultados() {
  // Check estado
  try {
    const r = await fetch(`${FIREBASE_URL}/estado/cerrado.json`);
    const val = await r.json();
    enviosCerrados = val === true;
    const pill = document.getElementById('status-pill');
    const btnCerrar = document.getElementById('btn-cerrar');
    if(enviosCerrados){
      pill.textContent = '⊘ ENVÍOS CERRADOS';
      pill.className = 'status-pill closed';
      btnCerrar.textContent = '● ABRIR ENVÍOS';
      btnCerrar.className = 'btn btn-gr';
    } else {
      pill.textContent = '● ENVÍOS ABIERTOS';
      pill.className = 'status-pill open';
      btnCerrar.textContent = '⊘ CERRAR ENVÍOS';
      btnCerrar.className = 'btn btn-rd';
    }
  } catch(e){}

  // Load respuestas
  try {
    const res = await fetch(`${FIREBASE_URL}/respuestas.json`);
    const data = await res.json();

    if(!data){
      document.getElementById('num-enviados').textContent = '0';
      document.getElementById('counter-fill').style.width = '0%';
      document.getElementById('resultados').innerHTML = '<div class="empty">Aún no hay respuestas enviadas.</div>';
      return;
    }

    const equipos = Object.keys(data);
    const n = equipos.length;
    document.getElementById('num-enviados').textContent = n;
    document.getElementById('counter-fill').style.width = Math.min(100, Math.round(n/6*100))+'%';

    let html = '';
    for(const [caseNum, caseData] of Object.entries(CASES)){
      html += `<div class="case-section"><div class="case-title">${caseData.title}</div>`;
      for(const p of caseData.preguntas){
        const conteo = [0,0,0,0];
        equipos.forEach(eq => {
          const resp = data[eq]?.respuestas?.[p.key];
          if(resp !== undefined && resp >= 0 && resp <= 3) conteo[resp]++;
        });
        const total = n || 1;
        html += `<div class="qblock"><div class="qnum">// PREGUNTA</div><div class="qtext">${p.text}</div>`;
        p.opts.forEach((opt, j) => {
          const pct = Math.round(conteo[j]/total*100);
          const isCorrect = j === p.correct;
          html += `<div class="bar-row">
            <span class="bar-letter">${String.fromCharCode(65+j)}</span>
            <div class="bar-wrap">
              <div class="bar-fill ${isCorrect?'correct':'wrong'}" style="width:${pct}%">
                <span class="bar-pct" style="display:${pct>8?'block':'none'}">${pct}%</span>
              </div>
            </div>
            <span class="bar-count">${conteo[j]}</span>
          </div>`;
        });
        html += `<div class="correct-label">✓ CORRECTA: ${String.fromCharCode(65+p.correct)}</div></div>`;
      }
      html += '</div>';
    }
    document.getElementById('resultados').innerHTML = html;

  } catch(e){
    document.getElementById('resultados').innerHTML = '<div class="empty">Error al conectar con Firebase. Comprueba la URL.</div>';
  }
}

async function cerrarEnvios(){
  if(enviosCerrados){
    // Reopen
    await fetch(`${FIREBASE_URL}/estado/cerrado.json`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(false)
    });
  } else {
    // Close
    await fetch(`${FIREBASE_URL}/estado/cerrado.json`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(true)
    });
  }
  await cargarResultados();
}

function toggleAutoRefresh(){
  const btn = document.getElementById('btn-auto');
  const info = document.getElementById('auto-info');
  if(autoInterval){
    clearInterval(autoInterval);
    autoInterval = null;
    btn.textContent = '▶ AUTO (10s)';
    btn.className = 'btn btn-gr';
    info.textContent = '';
  } else {
    cargarResultados();
    autoInterval = setInterval(()=>{
      cargarResultados();
    }, 10000);
    btn.textContent = '⏹ DETENER AUTO';
    btn.className = 'btn btn-rd';
    info.textContent = '// Actualizando cada 10 segundos...';
  }
}

// Load on start
cargarResultados();
</script>
</body>
</html>
